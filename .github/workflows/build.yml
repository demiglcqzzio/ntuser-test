name: Build NTUSER Generator

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Compile with MSVC
      run: |
        cl /MT /GS- /O2 /D_CRT_SECURE_NO_WARNINGS main.cpp shell32.lib

    - name: Prepare Runtime and DLLs
      run: |
        # 1. 提取 32 位 offreg.dll
        copy C:\Windows\SysWOW64\offreg.dll .\offreg.dll
        
        # 2. 从 Windows SDK 提取全套 32 位 UCRT 运行库 (这才是真正的源头)
        $ucrtPath = "C:\Program Files (x86)\Windows Kits\10\Redist\ucrt\DLLs\x86"
        if (Test-Path $ucrtPath) {
            Copy-Item "$ucrtPath\*.dll" .\
        } else {
            Write-Error "找不到 UCRT 运行库目录！"
        }
        
        # 3. 从 Visual Studio 提取基础 C++ 运行库
        $vcPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC\*\x86\Microsoft.VC143.CRT"
        if (Test-Path $vcPath) {
            Copy-Item "$vcPath\*.dll" .\
        }

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ntuser_generator
        path: |
          main.exe
          *.dll
