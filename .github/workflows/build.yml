name: Build NTUSER Generator

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86  # 编译 32 位程序

    - name: Compile with MSVC
      run: |
        # 纯净编译，不再依赖老旧 stdio 库
        cl /MT /O2 main.c

    - name: Extract 32-bit offreg.dll
      run: |
        # 从 SysWOW64 提取 32 位 DLL（System32 里的是 64 位）
        copy C:\Windows\SysWOW64\offreg.dll .\offreg.dll

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ntuser_generator
        path: |
          main.exe
          offreg.dll
