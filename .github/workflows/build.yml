name: Build NTUSER Generator

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Compile with MSVC
      run: |
        # /NODEFAULTLIB 剥离默认运行库，强制链接基础库
        cl /MT /O2 /D_CRT_SECURE_NO_WARNINGS main.c /link /NODEFAULTLIB:libucrt.lib /NODEFAULTLIB:libcmt.lib /NODEFAULTLIB:msvcrt.lib legacy_stdio_definitions.lib oldnames.lib kernel32.lib user32.lib

    - name: Extract 32-bit offreg.dll
      run: |
        copy C:\Windows\SysWOW64\offreg.dll .\offreg.dll

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ntuser_generator
        path: |
          main.exe
          offreg.dll
