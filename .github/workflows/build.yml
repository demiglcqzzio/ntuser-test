name: Build NTUSER Generator

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSVC environment (v142)
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86
        toolset-version: '14.29'   # 强制使用 VS2019 (v142) 编译器

    - name: Compile with MSVC
      run: |
        # 直接用旧编译器标准的静态链接，不需要任何花里胡哨的参数
        cl /MT /O2 /D_CRT_SECURE_NO_WARNINGS main.c

    - name: Extract 32-bit offreg.dll
      run: |
        copy C:\Windows\SysWOW64\offreg.dll .\offreg.dll

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ntuser_generator
        path: |
          main.exe
          offreg.dll
