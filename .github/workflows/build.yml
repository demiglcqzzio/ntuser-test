name: Build NTUSER Generator

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Compile with MSVC
      run: |
        # 1. 编译为纯 C 目标文件
        cl /c /MT /O2 /D_CRT_SECURE_NO_WARNINGS main.c
        
        # 2. 链接时强制指定子系统版本为 6.01 (Windows 7)
        # 3. 剥离所有较新版本的 UCRT 和 VCRuntime 库，强制静态链接旧版 CRT
        link /SUBSYSTEM:CONSOLE,6.01 /NODEFAULTLIB:libucrt.lib /NODEFAULTLIB:libvcruntime.lib /NODEFAULTLIB:ucrt.lib /NODEFAULTLIB:vcruntime.lib /NODEFAULTLIB:msvcrt.lib /NODEFAULTLIB:libcmt.lib /NODEFAULTLIB:msvcprt.lib main.obj kernel32.lib user32.lib legacy_stdio_definitions.lib oldnames.lib

    - name: Extract 32-bit offreg.dll
      run: |
        copy C:\Windows\SysWOW64\offreg.dll .\offreg.dll

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ntuser_generator
        path: |
          main.exe
          offreg.dll
