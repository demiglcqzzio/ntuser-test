name: Build NTUSER Generator

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Compile with MSVC
      run: |
        # 编译为 C++ (忽略 C 语法检查)，指定 Win32 入口点，剥离所有默认 C 运行库
        cl /c /MT /O2 /TP /D_CRT_SECURE_NO_WARNINGS main.c
        link /ENTRY:wWinMainCRTStartup /SUBSYSTEM:CONSOLE /NODEFAULTLIB kernel32.lib user32.lib shell32.lib main.obj

    - name: Extract 32-bit offreg.dll
      run: |
        copy C:\Windows\SysWOW64\offreg.dll .\offreg.dll

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ntuser_generator
        path: |
          main.exe
          offreg.dll
