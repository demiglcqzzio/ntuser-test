name: Build NTUSER Generator

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Compile with MSVC
      run: |
        # 编译最新防线版 main.cpp
        cl /MT /GS- /O2 /D_CRT_SECURE_NO_WARNINGS main.cpp shell32.lib

    - name: Extract 32-bit offreg.dll
      run: |
        # 提取 32 位 offreg.dll
        copy C:\Windows\SysWOW64\offreg.dll .\offreg.dll

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ntuser_generator
        path: |
          main.exe
          offreg.dll
