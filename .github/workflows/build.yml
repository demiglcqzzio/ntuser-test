name: Build NTUSER Generator

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download and Locate Offreg
      shell: pwsh
      run: |
        # 1. 下载 NuGet 包
        Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.Windows.SDK.CPP.x86/10.0.22621.3233" -OutFile "sdk.nupkg"
        Expand-Archive -Path "sdk.nupkg" -DestinationPath "sdk_extracted"
        
        # 2. 暴力搜索 offreg.h 和 offreg.lib 的位置
        $h = Get-ChildItem -Path "sdk_extracted" -Filter "offreg.h" -Recurse | Select-Object -First 1
        $l = Get-ChildItem -Path "sdk_extracted" -Filter "offreg.lib" -Recurse | Select-Object -First 1
        
        if (-not $h -or -not $l) {
            Write-Error "Could not find offreg.h or offreg.lib in the package"
            exit 1
        }
        
        Write-Host "Found offreg.h at: $($h.FullName)"
        Write-Host "Found offreg.lib at: $($l.FullName)"
        
        # 3. 把它们所在目录直接输出给环境变量
        echo "OFFREG_INC=$($h.DirectoryName)" >> $env:GITHUB_ENV
        echo "OFFREG_LIB=$($l.DirectoryName)" >> $env:GITHUB_ENV

    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Compile with MSVC
      shell: pwsh
      run: |
        # 动态指定搜索路径，不再使用 #pragma comment(lib) 避免找不到
        cl /MT /O2 /I"$env:OFFREG_INC" main.c /link /LIBPATH:"$env:OFFREG_LIB"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ntuser_generator
        path: |
          main.exe
          C:\Windows\System32\offreg.dll
