name: Build NTUSER Generator

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSVC environment (v142)
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86
        toolset-version: '14.29'

    - name: Compile with MSVC
      run: |
        # 编译为纯C目标文件，关闭安全检查和浮点标志
        cl /c /MT /GS- /O2 /D_CRT_SECURE_NO_WARNINGS /D_FLTUSED main.c
        # 链接：使用自定义入口点，剥离所有默认 C 库
        link /ENTRY:EntryPoint /SUBSYSTEM:CONSOLE,6.01 /NODEFAULTLIB /NODEFAULTLIB:libucrt.lib /NODEFAULTLIB:libvcruntime.lib /NODEFAULTLIB:libcmt.lib /NODEFAULTLIB:msvcrt.lib main.obj kernel32.lib user32.lib shell32.lib

    - name: Extract 32-bit offreg.dll
      run: |
        copy C:\Windows\SysWOW64\offreg.dll .\offreg.dll

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ntuser_generator
        path: |
          main.exe
          offreg.dll
