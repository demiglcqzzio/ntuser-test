name: Build NTUSER Generator (GCC)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download MinGW-w64 (MSVCRT runtime)
      shell: pwsh
      run: |
        # 下载基于 MSVCRT 的 MinGW-w64（而非 UCRT 版本）
        $url = "https://github.com/brechtsanders/winlibs_mingw/releases/download/13.2.0-16.0.6-11.0.1-msvcrt-r1/winlibs-i686-posix-dwarf-gcc-13.2.0-mingw-w64msvcrt-11.0.1-r1.zip"
        Invoke-WebRequest -Uri $url -OutFile "mingw.zip"
        Expand-Archive -Path "mingw.zip" -DestinationPath "mingw"
        
        # 将 GCC 路径添加到环境变量
        $gccPath = (Get-ChildItem -Path "mingw" -Filter "bin" -Recurse -Directory | Select-Object -First 1).FullName
        echo "$gccPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Compile with GCC
      run: |
        # -static 静态链接 GCC 基础库，防止依赖 libgcc_s_dw2-1.dll
        gcc main.c -o main.exe -static -lshell32 -luser32 -ladvapi32

    - name: Extract 32-bit offreg.dll
      run: |
        copy C:\Windows\SysWOW64\offreg.dll .\offreg.dll

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ntuser_generator
        path: |
          main.exe
          offreg.dll
